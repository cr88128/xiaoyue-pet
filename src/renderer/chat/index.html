<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">  <meta name="viewport" content="width=device-width,initial-scale=1">  <title>小悦 · AI 助手</title>  <style>* { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text, #4A2B36);
    }
    #chat-root {
      width: 100%;
      height: 100%;
      background: var(--background, #FFF5F8);
      border-radius: 20px;
      box-shadow: 0 16px 48px rgba(255,123,169,0.18), 0 0 0 1px rgba(255,182,201,0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .chat-header {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 182, 201, 0.4);
      background: linear-gradient(180deg, rgba(255,255,255,0.85), transparent);
      -webkit-app-region: drag;
      user-select: none;
    }
    .chat-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent, #FFB6C9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      -webkit-app-region: no-drag;
    }
    .chat-title {
      flex: 1;
      min-width: 0;
    }
    .chat-title h3 {
      font-size: 14px;
      font-weight: 500;
      color: var(--text, #4A2B36);
      margin: 0;
    }
    .chat-title p {
      font-size: 11px;
      color: var(--muted, #A88A94);
      margin: 1px 0 0 0;
    }
    .chat-actions {
      display: flex;
      gap: 4px;
      -webkit-app-region: no-drag;
    }
    .icon-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      border-radius: 14px;
      color: var(--muted, #A88A94);
      font-size: 14px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover {
      background: rgba(255, 182, 201, 0.4);
      color: var(--text, #4A2B36);
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      scrollbar-width: none;
    }
    .messages::-webkit-scrollbar { width: 0; }
    .msg {
      max-width: 82%;
      padding: 9px 13px;
      border-radius: 14px;
      font-size: 13px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex;
      background: var(--primary, #FF7BA9);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: #fff;
      color: var(--text, #4A2B36);
      border: 1px solid rgba(255, 182, 201, 0.6);
      border-bottom-left-radius: 4px;
    }
    .msg.tool {
      align-self: flex-start;
      background: rgba(99, 153, 34, 0.08);
      color: #3B6D11;
      border: 1px dashed #97C459;
      font-size: 12px;
    }
    .msg.error {
      align-self: flex-start;
      background: rgba(226, 75, 74, 0.08);
      color: #A32D2D;
      border: 1px dashed #E24B4A;
      font-size: 12px;
    }
    .msg-label {
      font-size: 10px;
      color: var(--muted, #A88A94);
      margin-bottom: 3px;
      font-weight: 500;
    }
    .reasoning-block {
      font-size: 11px;
      color: var(--muted, #A88A94);
      background: rgba(244, 192, 209, 0.18);
      padding: 4px 8px;
      border-radius: 6px;
      margin-top: 6px;
      white-space: pre-wrap;
      font-style: italic;
    }
    .chat-input-area {
      flex: 0 0 auto;
      border-top: 1px solid rgba(255, 182, 201, 0.4);
      padding: 10px 12px 12px;
      background: rgba(255, 255, 255, 0.6);
    }
    .tool-row {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .tool-chip {
      padding: 4px 10px;
      border: 1px solid rgba(255, 182, 201, 0.7);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.7);
      color: var(--text, #4A2B36);
      font-size: 11px;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }
    .tool-chip:hover { background: var(--accent, #FFB6C9); color: #fff; }
    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }
    #chat-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid rgba(255, 182, 201, 0.6);
      border-radius: 16px;
      background: #fff;
      color: var(--text, #4A2B36);
      font-size: 13px;
      font-family: inherit;
      resize: none;
      max-height: 96px;
      min-height: 36px;
      outline: none;
    }
    #chat-input:focus { border-color: var(--primary, #FF7BA9); }
    .send-btn {
      padding: 8px 14px;
      border: none;
      border-radius: 16px;
      background: var(--primary, #FF7BA9);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      white-space: nowrap;
    }
    .send-btn:disabled {
      background: var(--muted, #A88A94);
      cursor: not-allowed;
    }
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      color: var(--muted, #A88A94);
    }
    .empty-state h2 {
      font-size: 16px;
      font-weight: 500;
      color: var(--text, #4A2B36);
      margin-bottom: 6px;
    }
    .empty-state p { font-size: 12px; line-height: 1.6; }
    .typing-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: var(--muted, #A88A94);
      border-radius: 50%;
      animation: blink 1.4s infinite;
      margin-right: 3px;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 60%, 100% { opacity: 0.2; } 30% { opacity: 1; } }</style>
</head>
<body><div id="chat-root"><div class="chat-header"><div class="chat-avatar">小</div><div class="chat-title"><h3>小悦 · AI 助手</h3><p id="model-line">未配置</p></div><div class="chat-actions"><button class="icon-btn" id="reset-btn" title="新对话">+</button> <button class="icon-btn" id="close-btn" title="关闭">×</button></div></div><div class="messages" id="messages"><div class="empty-state" id="empty-state"><h2>主人，欢迎回来 💕</h2><p>女仆小悦在此候命～可以陪主人聊天、<br>设提醒、记笔记、切换动作。<br>主人有什么吩咐尽管说 ✨</p></div></div><div class="chat-input-area"><div class="tool-row" id="tool-row"><button class="tool-chip" data-prompt="帮我把下面这段翻译成英语：">🌐 翻译</button> <button class="tool-chip" data-prompt="30 分钟后提醒我">⏰ 30 分钟提醒</button> <button class="tool-chip" data-prompt="小悦给主人鞠个躬吧">💃 让小悦鞠个躬</button> <button class="tool-chip" data-prompt="现在切下一首歌">🎵 下一歌</button> <button class="tool-chip" data-prompt="截个全屏">📸 截屏</button> <button class="tool-chip" data-prompt="查一下中国建筑现在的股价">📊 查股票</button></div><div class="input-row"><textarea id="chat-input" rows="1" placeholder="主人想吩咐小悦什么呢…"></textarea> <button class="send-btn" id="send-btn">发送</button></div></div></div></body>
</html>
